      .appbar { fill: #0D9488; }
      .appbar-text { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 12; }
      .banner { fill: #CCFBF1; stroke: #0D9488; stroke-width: 1.5; stroke-dasharray: 5,3; rx: 14; }
