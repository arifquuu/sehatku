      .badge { fill: #FEF3C7; stroke: #D97706; stroke-width: 1; rx: 8; }
      .arrow { stroke: #0D9488; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 6,4; }
